name: Build Android (proof)

# Proof build for the Elementis Unity project.
# Produces an Android APK (IL2CPP, ARM64, target SDK 34) from the proof project.
# Runs on GitHub-hosted runners (free tier, public repo).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   UNITY_EMAIL    - Unity ID email (Personal seat; online activation)
#   UNITY_PASSWORD - Unity ID password (must be a Unity ID password, not a
#                    Google/Facebook/Apple social login, and 2FA must be off)
# No license file is used: Unity removed offline (.alf/.ulf) activation for
# Personal seats, so the game-ci CLI activates online with these credentials.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-elementis-proof-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-elementis-proof-Android-
            Library-elementis-proof-

      - name: Build with Unity
        uses: game-ci/unity-builder@v6.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          cliVersion: v0.1.75
          targetPlatform: Android
          buildMethod: ProofBuild.BuildAndroid
          androidVersionCode: 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elementis-proof-apk
          path: build/Android/Android.apk
          if-no-files-found: error
